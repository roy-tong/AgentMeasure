name: Provider Trial — 7-day audit application
description: Apply for the external provider trial · one capability · 7 days · your data stays local
title: "[Provider Trial] "
labels: [provider-trial]
body:
  - type: markdown
    attributes:
      value: |
        **What you get:** a 7-day measurement of one of your capabilities — retry inflation,
        execution economics, and traffic quality — plus a 45-minute review call.

        **What we ask:** ~30 minutes to integrate the SDK (one `npm install` from the release
        tarball, wrap your tool handlers), and 7 days of real traffic observed on your machine.

        Full methodology: [`product/AUDIT.md`](https://github.com/roy-tong/AgentMeasure/blob/main/product/AUDIT.md) ·
        Program context: [#2](https://github.com/roy-tong/AgentMeasure/issues/2)

        We take 3 providers per cycle. If the method breaks on your data, we document that too.
  - type: input
    id: provider
    attributes:
      label: Provider / project name
      description: What you build, in one line
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Capability / API / MCP server
      description: The one capability you'd put under measurement
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - MCP server
        - HTTP API
        - CLI tool
        - Other
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Approx. traffic volume
      description: Calls per day — honest ranges are fine ("~500/day", "spiky, 0–5k")
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track preference
      description: Private Alpha keeps your name and findings confidential; Public Alpha lets us publish the anonymized findings.
      options:
        - Private Alpha
        - Public Alpha
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything we should know?
      description: Suspicious retry patterns, traffic you can't classify, billing questions — optional
