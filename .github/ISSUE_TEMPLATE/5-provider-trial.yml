name: Provider integration feedback
description: Report an integration need or reproducible metering issue; no service commitment
title: "[Provider feedback] "
labels: [provider-trial]
body:
  - type: markdown
    attributes:
      value: |
        Share a reproducible provider integration issue or describe the metering decision you need help with.
        This is a public issue. Do not include private customer data, credentials or raw production logs.
        It does not reserve a free audit or create a service commitment.

        For a scoped paid check, see [the $10 / $20 services](https://roy-tong.github.io/verovo/services.html).
        SDK installation: `npm install @verovo/mcp`.
  - type: input
    id: provider
    attributes:
      label: Provider / project name
      description: What you build, in one line
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Capability / API / MCP server
      description: The one capability you'd put under measurement
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - MCP server
        - HTTP API
        - CLI tool
        - Other
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Approx. traffic volume
      description: Calls per day — honest ranges are fine ("~500/day", "spiky, 0–5k")
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything we should know?
      description: Suspicious retry patterns, traffic you can't classify, billing questions — optional
