name: conformance

on:
  push:
    paths:
      - 'standard/**'
      - 'reference/**'
      - 'conformance/**'
      - 'schemas/**'
      - 'registry/**'
      - 'scripts/**'
      - 'docs/**'
      - 'product/**'
      - 'extensions/**'
      - 'whitepaper/**'
      - 'sdk/**'
      - 'lab/**'
      - 'examples/**'
      - 'benchmark/**'
      - 'healthcheck/**'
      - 'buyer-ledger/**'
      - 'reports/**'
      - 'bundles/**'
      - 'README*'
      - 'ROADMAP.md'
      - 'GOVERNANCE.md'
      - 'CONTRIBUTING.md'
      - 'LEGACY-MIGRATION.md'
      - 'verify_vectors.py'
      - 'website/**'
      - '.github/workflows/**'
  workflow_dispatch:
  pull_request:

jobs:
  # ─── 套件 0：local healthcheck adapter + check contracts ───
  healthcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Healthcheck unit tests and selftest
        run: |
          python3 -m unittest discover -s healthcheck/tests
          python3 healthcheck/verovo selftest
      - name: Healthcheck install smoke (packaged artifact)
        run: bash healthcheck/scripts/smoke_install.sh

  # ─── 套件 0b：Windows 提前保障（控制台/路径/编码差异，无真机时的常驻回归） ───
  healthcheck-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Healthcheck unit tests on Windows
        run: |
          python -m unittest discover -s healthcheck/tests
      - name: CLI smoke on a Windows console codepage (demo + share export)
        run: |
          python healthcheck/verovo demo --json demo-report.json
          python healthcheck/verovo share demo-report.json --out summary.json
          python healthcheck/verovo validate summary.json

  # ─── 套件 0c：buyer-ledger（买方侧统一费用账本，M1；不变量 INV-1..6） ───
  buyer-ledger:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Buyer ledger unit tests (ledger invariants / parsing / reconcile / recipes)
        run: |
          python3 -m unittest discover -s buyer-ledger/tests -t buyer-ledger
      - name: Recipe examples validate (read-only whitelist, no credential actions)
        run: |
          python3 - <<'PY'
          import glob, sys
          sys.path.insert(0, "buyer-ledger")
          from buyer_ledger import browser
          for path in glob.glob("buyer-ledger/recipes/examples/*.json"):
              errors = browser.validate_recipe(browser.load_recipe(path))
              assert not errors, "%s: %s" % (path, errors)
              print("recipe OK:", path)
          PY

  # ─── 套件 1：spec conformance（向量 + registry + metric registry） ───
  spec-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verovo test vectors
        env:
          PYTHONPATH: reference
        run: |
          python3 verify_vectors.py
      - name: Metric contract vectors
        env:
          PYTHONPATH: reference
        run: |
          python3 conformance/runners/run_metrics.py
      - name: "External fixture conformance (Urusilla-001: issues 8+9 guards)"
        run: |
          python3 conformance/runners/run_external_fixture.py
      - name: "External fixture conformance (Urusilla-002: issue 10 / AM-U-007 grain guard)"
        run: |
          python3 conformance/runners/run_external_fixture_002.py
      - name: "External fixture conformance (chenhz01-001: issue 11 / availability certification axis)"
        run: |
          python3 conformance/runners/run_external_fixture_003.py
      - name: "Outcome-family conformance (OUT-001..004: definability / traceability / reopen dedup / claim-evidence)"
        run: |
          python3 conformance/runners/run_outcome_audit.py
      - name: "Delegation-family conformance (DELEGATION-001..007: counting + the four failure modes)"
        run: |
          python3 conformance/runners/run_delegation.py
      - name: "Commerce retry baseline (F2.4: 1 Operation / 2 Attempts / 1 verified order / net GMV = 0)"
        run: |
          python3 conformance/runners/run_commerce_retry.py
      - name: "SSE usage conformance (SSE-001: Anthropic message_start input bucket)"
        run: |
          python3 conformance/runners/run_sse_usage.py
      - name: "Aggregate-join conformance (VSS-1 S-9: an aggregate is evidence only if it reconciles to its members)"
        run: |
          python3 conformance/runners/run_aggregate_join.py
      - name: "Replay-digest conformance (VSS-1 S-9: cost preservation stated as bytes)"
        run: |
          python3 conformance/runners/run_replay_digest.py
      - name: "Browser-local recount: rules file in sync with the registry"
        run: |
          python3 scripts/gen_web_rules.py --check
      - name: "Adapter freshness canary (pinned session-format generations)"
        run: |
          python3 scripts/adapter_canary.py
      - name: "Rule cards: website/rules/ in sync with the registry"
        run: |
          python3 scripts/gen_rule_cards.py --check
      - name: "Browser-local recount: JS and Python parity on the same fixture"
        run: |
          python3 -m unittest discover -s tests -p "test_parity.py" -v
        working-directory: healthcheck
      - name: "Evidence case: assumed-resolution (pins the published 70% vs 40% numbers)"
        run: |
          python3 conformance/evidence/assumed-resolution/run_case.py
      - name: "Evidence case: unknown model pricing (no silent fallback)"
        run: |
          python3 conformance/evidence/unknown-model-pricing/run_case.py
      - name: "Evidence case: selfhosted reconcile (client vs server surface, absent != zero)"
        run: |
          python3 conformance/evidence/selfhosted-openai-compatible-reconcile/run_case.py
      - name: "Pricing explicit-zero vectors (fallback never applies to explicit 0.0)"
        run: |
          python3 conformance/runners/run_pricing_zero.py
      - name: "Conformance Pack selftest (caller-input contract)"
        run: |
          python3 conformance/pack/verovo selftest
      - name: Registry validation (entities)
        run: |
          python3 registry/validate_entities.py
      - name: Metric registry validation (metrics.yaml ↔ METRICS.md)
        run: |
          python3 registry/validate_metrics.py
      - name: "Token rates registry validation (structure + time-window selection selftest)"
        run: |
          python3 registry/validate_token_rates.py --selftest
      - name: Canonical observation schema validation
        run: |
          python3 schemas/validate_observation.py
      - name: "Vocabulary registry single-source check (yaml, schema, TS, Python)"
        run: |
          python3 scripts/gen_vocab.py --check
      - name: "Evidence bundles: statistics-layer recomputation (stats-recomputable guard)"
        run: |
          status=0
          for f in bundles/*/recompute_stats.py; do
            if [ -e "$f" ]; then
              echo "== $f"
              python3 "$f" || status=1
            fi
          done
          exit $status

  # ─── 套件 2：reference implementation（canonical boundary gate） ───
  reference-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Core integrity tests (0.4.3 data model, canonical ingestion only)
        env:
          PYTHONPATH: reference
        run: |
          python3 scripts/canonical_core_gate.py
      - name: Choice end-to-end (M2.2 / M2.5)
        env:
          PYTHONPATH: reference
        run: |
          python3 - <<'PY'
          import sys, json, tempfile, pathlib
          sys.path.insert(0, ".")
          from collector.choice import connect, ingest_choice_events, selection_metrics, conditional_choice_share
          tmp = pathlib.Path(tempfile.mkdtemp())
          conn = connect(tmp / "choice.db")
          events = [
              {"type": "presented", "decision_id": f"d{i}", "candidate_set_id": "c1",
               "project_id": "github.com/foo/bar", "tool": "Exa", "choice_mode": "exclusive",
               "context": "production", "validity": "normal", "ts": "2026-08-16T00:00:00Z"}
              for i in range(10)
          ] + [
              {"type": "selected", "decision_id": f"d{i}", "candidate_set_id": "c1",
               "project_id": "github.com/foo/bar", "tool": "Exa", "choice_mode": "exclusive",
               "decision_authority": "model", "selection_constraint": "autonomous",
               "context": "production", "validity": "normal", "ts": "2026-08-16T00:01:00Z"}
              for i in range(4)
          ]
          p = tmp / "events.jsonl"
          p.write_text("\n".join(json.dumps(e) for e in events))
          ingest_choice_events(conn, p)
          # fixture pins 2026-08-16; anchor window to the fixture, not the wall
          # clock (same class c9a7824 fixed in runners)
          sm = selection_metrics(conn, "github.com/foo/bar", days=3650)
          assert sm["tools"][0]["observed_selection_rate"] == 0.4, sm
          cs = conditional_choice_share(conn, "Exa", "Tavily", project_id="github.com/foo/bar", days=3650)
          assert cs["co_presented_decisions"] == 0, cs  # Tavily 未同台 -> fail-closed 空分母
          print("choice: M2.2=0.4, M2.5 fail-closed OK")
          PY
      - name: Adapter privacy tests
        run: |
          python3 - <<'PY'
          import sys, json, tempfile, pathlib, os, subprocess
          tmp = pathlib.Path(tempfile.mkdtemp())
          env = dict(os.environ, VEROVO_EVENTS_DIR=str(tmp / "hook"))
          subprocess.run([sys.executable, "reference/adapters/codex/hook_agent.py"], input=json.dumps({
              "hook_event_name": "PostToolUse", "tool_name": "Bash", "tool_use_id": "tu-1",
              "session_id": "RAW-SESSION-42",
              "tool_input": {"command": "cat /etc/shadow"},
              "tool_response": "SUPER-SECRET",
              "trace_id": "ignored", "is_error": True}), capture_output=True, text=True, env=env)
          raw = (tmp / "hook" / "codex-hook-events.jsonl").read_text()
          assert "RAW-SESSION-42" not in raw and "SUPER-SECRET" not in raw and "shadow" not in raw
          assert "trace_id" not in raw and "is_error" not in raw
          assert "p-" in raw
          print("adapter privacy OK")
          PY

  # ─── 套件 3：Verovo Lab（experiment engine） ───
  lab-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Lab unit + regression tests (incl. #8 oneOf sibling tests)
        run: |
          python3 -m unittest discover -s lab/tests

  # ─── 套件 4：Provider SDK（External-Ready gate） ───
  sdk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install + build SDK
        run: |
          cd sdk && npm ci && npm run build
      - name: SDK unit tests (schema / fail-open / privacy / lineage / caller / concurrency / buffer / mcp-integration)
        run: |
          cd sdk && npm test
      - name: Canonical-boundary pipeline gate (SDK → JSONL → validate → ingest → metrics)
        run: |
          python3 scripts/verify_sdk_pipeline.py

  # ─── 套件 5：documentation consistency（spec-drift） ───
  documentation-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Spec-drift check (legacy vocabulary + version stamps)
        run: |
          python3 scripts/spec_drift.py

  # ─── 套件 6：website status.json sync（green run → repo state → site） ───
  # Only on main pushes: regenerate website/status.json from repo state; when it
  # changes, commit to main and mirror to gh-pages. website/** is not in the
  # push path filter above, so this cannot re-trigger the workflow.
  # ─── Release smoke: the packaged artifact must actually run ───
  # Source-tree tests passing is not "installable" (the 0.4.0 NameError
  # lesson). Build the wheel, install it into a fresh venv, run the basic
  # paths a first-time user would.
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the wheel (the artifact PyPI will serve)
        run: |
          python -m pip install --user build
          python -m build --wheel --outdir dist/ healthcheck/
      - name: Fresh-venv install + first-run paths
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/verovo --version
          cd /tmp && /tmp/smoke/bin/verovo demo --no-history
          /tmp/smoke/bin/verovo selftest
          /tmp/smoke/bin/verovo recount --list-vendors
          /tmp/smoke/bin/verovo recount --sample
          printf '%s\n' '{"type":"assistant","message":{"id":"smoke"}}' > /tmp/response.jsonl
          /tmp/smoke/bin/verovo response-audit /tmp/response.jsonl
          /tmp/smoke/bin/verovo conformance --new-vector smoke-case --out /tmp/am-smoke-vectors
          /tmp/smoke/bin/verovo conformance --fixture /tmp/am-smoke-vectors/smoke-case-001/verovo_smoke_case_fixture_001.events.jsonl

  status-sync:
    runs-on: ubuntu-latest
    needs: [healthcheck, healthcheck-windows, buyer-ledger, spec-conformance, reference-implementation, lab-suite, sdk-gate, documentation-consistency, release-smoke]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: status-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate website/status.json (binds Passing to this run)
        run: |
          python3 scripts/gen_status.py --write
          git config user.name "verovo-ci"
          git config user.email "actions@users.noreply.github.com"
          git add website/status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync website/status.json (verified @ ${GITHUB_SHA:0:7}) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Mirror website/ to gh-pages (the live site)
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          git checkout main -- website/
          # the site serves from the repo root of gh-pages
          cp -r website/. ./
          # drop the staging dir and any legacy duplicate so add -A is clean
          rm -rf website
          git add -A
          git commit -m "deploy: website sync (CI)" || echo "gh-pages unchanged"
          git push origin gh-pages
