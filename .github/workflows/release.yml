name: release

# Creates/updates GitHub Releases from docs/RELEASE-<tag>.md and, when an npm
# token exists, publishes @verovo/mcp. Uses the Actions-provided
# GITHUB_TOKEN (contents: write) — no local credentials required.
#
# Triggers:
#   - push of a v* tag (e.g. v0.1.1)
#   - manual workflow_dispatch (requires an explicit existing vX.Y.Z tag)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v0.9.0 (required for a manual run)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve and verify tag
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="${REQUESTED_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::An explicit vX.Y.Z tag is required."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('healthcheck/pyproject.toml','rb'))['project']['version'])")
          test "$TAG" = "v$VER"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/RELEASE-${TAG}.md"
          if [[ ! -f "$NOTES" ]]; then
            echo "::error::Release notes $NOTES not found. Add the file before tagging $TAG. (The old silent fallback to v0.1.1 notes shipped a wrong body on v0.7.0.)"
            exit 1
          fi
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG — Verovo" --notes-file "$NOTES"
          fi

      - name: Mark v0.1.0 as superseded (history kept, not deleted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 --json tagName >/dev/null 2>&1; then
            BODY="$(gh release view v0.1.0 --json body -q .body)"
            if ! printf '%s' "$BODY" | grep -q "Superseded by v0.1.1"; then
              NOTE='> **Superseded by v0.1.1.** The original release contained several measurement-model issues (reported 42/126 observations, an unverifiable "no self-reported numbers" claim, and a non-reproducible demo); all are documented and fixed in the changelog. History is kept, not deleted.'
              gh release edit v0.1.0 --notes "$(printf '%s\n\n%s' "$NOTE" "$BODY")"
              echo "v0.1.0 marked as superseded"
            else
              echo "v0.1.0 already marked"
            fi
          else
            echo "v0.1.0 release not found (nothing to supersede)"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Attach built npm tarball as release asset
        working-directory: sdk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
          PKG_VERSION=$(node -p "require('./package.json').version")
          npm pack --pack-destination .
          gh release upload "$TAG" "verovo-mcp-${PKG_VERSION}.tgz" --clobber

      # ── process fix (live-codex-desc-clarity-001 lesson): bundles ship with the tag ──
      # Every bundles/<experiment-id>/ is zipped and attached as a release asset, so a
      # tagged release always carries its verifiable artifacts. The checklist that
      # populates bundles/ before tagging lives in lab/README.md ("Releasing a live run").
      - name: Attach evidence bundles as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G "bundles/*" > /dev/null; then
            for d in bundles/*/; do
              id="$(basename "$d")"
              zipfile="/tmp/bundle-${id}.zip"
              (cd "$d" && zip -r -q "$zipfile" .)
              gh release upload "$TAG" "$zipfile" --clobber
              echo "attached $zipfile"
            done
          else
            echo "no bundles/ to attach"
          fi

  npm-publish:
    runs-on: ubuntu-latest
    needs: github-release
    # secrets cannot be referenced directly in job-level `if`; route through env
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org/'
      - name: Publish @verovo/mcp (runs only when NPM_TOKEN secret exists)
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm ci
          npm run build
          npm test
          # idempotent: a re-run of the same tag must not 409 on npm
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "@verovo/mcp@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "@verovo/mcp@${PKG_VERSION} already on npm — skipping publish"
          else
            npm publish --access public
          fi

  # ── PyPI: `pipx install verovo` ──
  # Uses PyPI trusted publishing (OIDC): NO API token to store or leak.
  # One-time setup on PyPI (account owner): Publishing → Add a pending publisher
  #   PyPI project name: verovo
  #   owner: roy-tong · repository: Verovo · workflow: release.yml
  #   environment: (leave empty)
  # After that, commit the empty marker file `healthcheck/.pypi-ready` and push
  # a vX tag — this job then builds and publishes the healthcheck CLI.
  pypi-publish:
    runs-on: ubuntu-latest
    needs: github-release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Skip if this version is already live on PyPI (idempotent re-runs)
        run: |
          VER=$(python3 -c "import tomllib; print(tomllib.load(open('healthcheck/pyproject.toml','rb'))['project']['version'])" 2>/dev/null || echo unknown)
          LIVE=$(curl -sf "https://pypi.org/pypi/verovo/json" | python3 -c "import json,sys; print(json.load(sys.stdin)['info']['version'])" 2>/dev/null || echo none)
          echo "local=$VER live=$LIVE"
          if [[ "$VER" != "unknown" && "$VER" == "$LIVE" ]]; then
            echo "verovo $VER already live on PyPI — skipping publish"
            echo "pypi_skip=true" >> "$GITHUB_ENV"
          else
            echo "pypi_skip=false" >> "$GITHUB_ENV"
          fi
      - name: Gate on PyPI readiness marker
        id: gate
        run: |
          if [[ -f healthcheck/.pypi-ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "PyPI publishing enabled"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "PyPI publishing not enabled yet (no healthcheck/.pypi-ready marker) — skipping"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.gate.outputs.ready == 'true' }}
        with:
          python-version: '3.11'
      - name: Build sdist + wheel
        if: ${{ steps.gate.outputs.ready == 'true' }}
        run: |
          python -m pip install --user build
          python -m build --sdist --wheel --outdir dist/ healthcheck/
          ls -l dist/
      - name: Publish verovo to PyPI
        if: ${{ steps.gate.outputs.ready == 'true' && env.pypi_skip != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
