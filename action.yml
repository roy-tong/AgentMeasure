name: "Verovo Conformance"
description: Check an agent-telemetry fixture against measurement invariants (PASS / FAIL / UNPROVABLE). Turning measurement assumptions into CI checks.
inputs:
  fixture:
    description: "Path to an FMT-002 funnel-event JSONL fixture, relative to the calling workspace"
    required: true
  metadata:
    description: "Optional path to sidecar metadata JSON (source, time window, observation surface, production|synthetic)"
    required: false
    default: ""
  claims:
    description: "Optional path to observed-claims JSON; when supplied, claimed values are compared against computation and mismatches FAIL"
    required: false
    default: ""
  require:
    description: "Comma-separated invariant ids that must be PROVEN (UNPROVABLE blocks the check). Default: none — findings are reported without blocking."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install Verovo
      shell: bash
      run: pipx install verovo
    - name: Run Verovo conformance pack
      shell: bash
      env:
        VEROVO_FIXTURE: ${{ inputs.fixture }}
        VEROVO_METADATA: ${{ inputs.metadata }}
        VEROVO_CLAIMS: ${{ inputs.claims }}
        VEROVO_REQUIRE: ${{ inputs.require }}
      run: |
        set -euo pipefail
        ARGS=(conformance --fixture "$VEROVO_FIXTURE")
        [ -n "$VEROVO_METADATA" ] && ARGS+=("--metadata" "$VEROVO_METADATA")
        [ -n "$VEROVO_CLAIMS" ] && ARGS+=("--claims" "$VEROVO_CLAIMS")
        [ -n "$VEROVO_REQUIRE" ] && ARGS+=("--require" "$VEROVO_REQUIRE")
        verovo "${ARGS[@]}" | tee pack-report.txt
        echo '## Verovo Conformance' >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        cat pack-report.txt >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
branding:
  icon: "check-circle"
  color: "green"
