[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (decision 2026-09-05: `agentmeasure`, confirmed by Roy).
# The command is also `agentmeasure`. JSON exports keep the stable tool tag
# "agentmeasure-healthcheck" from schema v1 — do not rename inside exports.
name = "agentmeasure"
version = "0.4.0"
description = "AgentMeasure — check-up report for coding agent runs + conformance pack for telemetry fixture verification. Zero external dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agent", "codex", "claude", "observability", "measurement", "healthcheck", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
agentmeasure = "am_healthcheck.cli:main"

[tool.setuptools]
packages = [
    "am_healthcheck",
]

[tool.setuptools.package-data]
am_healthcheck = [
    "fixtures/*.jsonl",
    "demo/*.jsonl",
    "pack_invariants.json",
    "lab/schemas/funnel-event.schema.json",
]
