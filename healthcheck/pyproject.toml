[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name (decision 2026-09-05: `verovo`, confirmed by Roy).
# The command is also `verovo`. JSON exports keep the stable tool tag
# "verovo-healthcheck" from schema v1 — do not rename inside exports.
name = "verovo"
version = "0.9.0"
description = "Buyer-side AI service charge and delivery review, supported bill recounts and local agent diagnostics. Zero external dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agent", "codex", "claude", "observability", "measurement", "healthcheck", "conformance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
verovo = "verovo_healthcheck.cli:main"

[tool.setuptools]
packages = [
    "verovo_healthcheck",
    "verovo_healthcheck.lab",
]

[tool.setuptools.package-data]
verovo_healthcheck = [
    "fixtures/*.jsonl",
    "fixtures/*.csv",
    "demo/*.jsonl",
    "demo/*.csv",
    "demo/*.json",
    "pack_invariants.json",
    "vendor-rules.json",
    "lab/schemas/funnel-event.schema.json",
]
